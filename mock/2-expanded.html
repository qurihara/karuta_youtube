<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>SpeechRewinder for YouTube — コントロールUI expanded</title>
  <link rel="stylesheet" href="./_base.css" />
</head>
<body>
  <div class="yt-top">
    <span class="yt-logo">YouTube<span class="red">▶</span></span>
    <div class="yt-search">第○○期競技かるた決勝</div>
  </div>

  <div class="yt-main">
    <div>
      <div class="yt-player">
        <div class="panel expanded">
          <div class="row">
            <button class="rewind-btn active" type="button" title="発話前に戻る">
              <span>◀</span><span>発話前に戻る</span>
            </button>
            <button class="gear-btn" type="button" title="詳細設定">⚙</button>
          </div>
          <div class="expandable">
            <div class="row n-row">
              <span class="n-label">N</span>
              <input class="n-slider" type="range" min="0" max="5" step="0.1" value="1.0" />
              <span class="n-value">1.0s</span>
            </div>
            <div class="settings-panel">
              <div class="row n-row">
                <span class="n-label">無音閾値</span>
                <input class="gap-slider" type="range" min="0.1" max="1" step="0.05" value="0.5" />
                <span class="n-value">0.5s</span>
              </div>
            </div>
            <canvas class="timeline" width="340" height="24"></canvas>
            <div class="status">
              <span><span class="dot"></span>音声認識準備完了</span>
              <span class="live-badge">LIVE</span>
            </div>
            <div class="debug">
              <span class="mic"></span>
              <span>f:1245 pk:0.084/0.32 g:5.9x p:0.731/0.99 seg:14 yt:1.00 ctx:r ●</span>
            </div>
          </div>
        </div>

        <div class="caption" style="top: 260px;">⚙ で展開 — N秒、無音閾値、タイムライン、診断行</div>

        <div class="yt-controls">
          <div class="play"></div>
          <div class="time">25:14 / 1:42:08</div>
          <div class="seekbar"></div>
        </div>
      </div>

      <div class="yt-meta">
        <h1>競技かるた 試合動画 (デモ画像)</h1>
        <div class="sub">読み手 — 公式戦サンプル</div>
      </div>
    </div>

    <div class="yt-side">
      <div class="yt-side-item">
        <div class="yt-side-thumb"></div>
        <div class="yt-side-text"><div class="t">関連動画 1</div>チャンネル名</div>
      </div>
      <div class="yt-side-item">
        <div class="yt-side-thumb"></div>
        <div class="yt-side-text"><div class="t">関連動画 2</div>チャンネル名</div>
      </div>
      <div class="yt-side-item">
        <div class="yt-side-thumb"></div>
        <div class="yt-side-text"><div class="t">関連動画 3</div>チャンネル名</div>
      </div>
      <div class="yt-side-item">
        <div class="yt-side-thumb"></div>
        <div class="yt-side-text"><div class="t">関連動画 4</div>チャンネル名</div>
      </div>
    </div>
  </div>

  <script>
    // Draw a simple timeline that mimics the actual renderer output:
    // grey bars for speech segments, a triangle for the latest uta mark,
    // and a white playhead at the right edge.
    const cnv = document.querySelector("canvas.timeline");
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const rect = cnv.getBoundingClientRect();
    cnv.width = Math.round(rect.width * dpr);
    cnv.height = Math.round(rect.height * dpr);
    const ctx = cnv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = rect.width, h = rect.height;

    // Mock segments (x ranges, in 0..1 of the 30s window)
    const segments = [
      [0.02, 0.10], [0.13, 0.20], [0.28, 0.35], [0.41, 0.55],
      [0.62, 0.70], [0.74, 0.85], [0.90, 0.97]
    ];
    ctx.fillStyle = "rgba(226, 232, 240, 0.65)";
    for (const [s, e] of segments) {
      ctx.fillRect(s * w, 4, (e - s) * w, h - 8);
    }
    // Uta marker (blue triangle on top at the latest segment start)
    const utaX = 0.90 * w;
    ctx.fillStyle = "#2563eb";
    ctx.beginPath();
    ctx.moveTo(utaX, 0);
    ctx.lineTo(utaX - 5, 6);
    ctx.lineTo(utaX + 5, 6);
    ctx.closePath();
    ctx.fill();
    // Playhead
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(w - 0.5, 0); ctx.lineTo(w - 0.5, h);
    ctx.stroke();
  </script>
</body>
</html>
