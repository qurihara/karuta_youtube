<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Karuta YouTube HUD — HUD active</title>
  <link rel="stylesheet" href="./_base.css" />
</head>
<body>
  <div class="yt-top">
    <span class="yt-logo">YouTube<span class="red">▶</span></span>
    <div class="yt-search">第○○期競技かるた決勝</div>
  </div>

  <div class="yt-main">
    <div>
      <div class="yt-player">
        <!-- The HUD: compact + active -->
        <div class="panel">
          <div class="row">
            <button class="rewind-btn active flash" type="button" title="静粛まで巻き戻し">
              <span>◀</span><span>静粛まで巻き戻し</span>
            </button>
            <button class="gear-btn" type="button" title="詳細設定">⚙</button>
          </div>
        </div>

        <div class="caption">上の句が始まった瞬間 → 青く点灯 → クリックで戻る</div>

        <div class="yt-controls">
          <div class="play"></div>
          <div class="time">25:14 / 1:42:08</div>
          <div class="seekbar"></div>
        </div>
      </div>

      <div class="yt-meta">
        <h1>競技かるた 試合動画 (デモ画像)</h1>
        <div class="sub">読み手 — 公式戦サンプル</div>
      </div>
    </div>

    <div class="yt-side">
      <div class="yt-side-item">
        <div class="yt-side-thumb"></div>
        <div class="yt-side-text"><div class="t">関連動画 1</div>チャンネル名</div>
      </div>
      <div class="yt-side-item">
        <div class="yt-side-thumb"></div>
        <div class="yt-side-text"><div class="t">関連動画 2</div>チャンネル名</div>
      </div>
      <div class="yt-side-item">
        <div class="yt-side-thumb"></div>
        <div class="yt-side-text"><div class="t">関連動画 3</div>チャンネル名</div>
      </div>
      <div class="yt-side-item">
        <div class="yt-side-thumb"></div>
        <div class="yt-side-text"><div class="t">関連動画 4</div>チャンネル名</div>
      </div>
    </div>
  </div>
</body>
</html>
